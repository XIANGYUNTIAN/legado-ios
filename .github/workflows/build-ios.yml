name: build-ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Legado/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Legado.xcodeproj \
            -scheme Legado \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Legado.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-"

      - name: Package IPA
        run: |
          rm -rf Payload Legado-unsigned.ipa
          mkdir -p Payload
          cp -R "build/Legado.xcarchive/Products/Applications/Legado.app" Payload/
          zip -qry Legado-unsigned.ipa Payload
          ls -lh Legado-unsigned.ipa
          unzip -l Legado-unsigned.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Legado-unsigned-ipa
          path: Legado-unsigned.ipa
          if-no-files-found: error
