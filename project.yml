name: Legado
options:
  bundleIdPrefix: com.legado
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
targets:
  Legado:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Legado
    dependencies:
      - package: SwiftSoup
    info:
      path: Legado/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legado.ios
        PRODUCT_NAME: Legado
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: true

schemes:
  Legado:
    build:
      targets:
        Legado: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
