name: Legado
options:
  bundleIdPrefix: com.legado
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.0
targets:
  Legado:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Legado
    dependencies:
      - package: SwiftSoup
    info:
      path: Legado/Info.plist
      properties:
        CFBundleDisplayName: Legado
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "4"
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: 用于扫描书源二维码
        # 【重要】只能保留 NSAllowsArbitraryLoads 一个键。
        # Apple 文档：iOS 10+ 若同时存在 NSAllowsLocalNetworking /
        # NSAllowsArbitraryLoadsInWebContent / NSAllowsArbitraryLoadsForMedia，
        # 则 NSAllowsArbitraryLoads 会被「忽略并按 NO 处理」→ HTTP 仍被 ATS 拦截（-1022）。
        # 曾因多加了 NSAllowsLocalNetworking 导致书源搜索全部报 ATS 错误。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legado.ios
        PRODUCT_NAME: Legado
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_PREVIEWS: true

schemes:
  Legado:
    build:
      targets:
        Legado: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
